<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Consulta</title>
<script src="config.js"></script>
<script src="app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{margin:0;background:#666;font-family:Arial,sans-serif;color:#111}
  .nav{display:flex;gap:8px;padding:8px;background:#444;position:sticky;top:0;z-index:20}
  .nav a{padding:6px 14px;border-radius:6px;background:#fff;color:#1f7a3f;text-decoration:none;font-weight:bold;font-size:14px}
  .nav a.on{background:#1f7a3f;color:#fff}
  .top{background:#5b6578;color:#fff;text-align:center;padding:8px 12px 10px;position:relative}
  .top .lbl{font-size:14px}
  .top .cod{font-size:40px;font-weight:bold;letter-spacing:1px;line-height:1.1}
  .top select{width:100%;max-width:520px;margin-top:6px;padding:7px;font-size:15px;text-align:center;border:0;background:#e5e7eb;color:#333;font-weight:bold}
  .top button{position:absolute;right:12px;top:10px;background:#0b4f7a;color:#fff;border:1px solid #fff5;padding:7px 18px;font-weight:bold;cursor:pointer;border-radius:3px}
  .linha{height:8px;background:#e00000;margin:8px 0 0}
  .wrap{padding:0 8px 24px}
  .paper{max-width:620px;margin:0 auto;background:#fff;padding:26px 36px 20px;min-height:760px;position:relative;box-sizing:border-box}
  .logo{font-weight:900;font-size:30px;letter-spacing:-1px}
  .logo .p{color:#d6202e}.logo .a{color:#1f4e9c}
  .nome{text-align:center;font-size:22px;margin:22px 0 14px}
  .dados{display:flex;justify-content:center;gap:36px;font-size:12px;line-height:1.7}
  .dados div{text-align:right}
  .dados span{color:#555}
  p{font-size:13px;line-height:1.5;margin:16px 14px}
  h3{text-align:center;font-size:16px;margin:28px 0 12px}
  .it{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:6px 8px;min-height:14px}
  .cx{width:11px;height:11px;border:1px solid #444;background:#fff;flex:none}
  .ass{text-align:center;font-size:13px;line-height:1.5;margin-top:34px;color:#222}
  .rod{text-align:center;margin-top:26px;font-size:12px}
  .data{position:absolute;right:10px;bottom:4px;font-size:8px}
  .vazio{color:#777;text-align:center;padding:40px}
  @page{size:A4;margin:10mm}
  @media print{
    .nav,.top,.linha{display:none!important}
    body,.wrap{background:#fff;padding:0}
    .paper{max-width:none;min-height:auto}
  }
  /* menu lateral: faixa de ícones; ao abrir (☰) ele cobre a tela e recolhe sozinho ao clicar fora */
  body.comMenu{padding-left:68px!important}
  .side{position:fixed;left:0;top:0;bottom:0;width:56px;background:#1f7a3f;z-index:40;display:flex;flex-direction:column;gap:2px;padding:8px 6px;box-sizing:border-box;overflow:hidden;transition:width .15s,box-shadow .15s}
  body.menuAberto .side{width:190px;box-shadow:4px 0 18px #0005}
  .side a{color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;white-space:nowrap;font-weight:bold;font-size:14px}
  .side a:hover{background:#2f9b57}.side a.on{background:#fff;color:#1f7a3f}
  .side .ic{width:22px;text-align:center;flex:none}
  .sideBtn{background:none!important;border:0;color:#fff;font-size:20px;text-align:left;padding:8px 12px!important;cursor:pointer;width:auto!important;min-width:0!important;flex:none!important;margin-bottom:6px}
  body:not(.menuAberto) .side .tx{display:none}
  @media print{body.comMenu{padding-left:0!important}.side{display:none!important}}
</style>
</head>
<body>
<aside class="side" id="side"><button type="button" class="sideBtn" onclick="alternarMenu()" title="Minimizar ou expandir o menu">☰</button><a href="novo.html" target="_top" title="Cadastro"><span class="ic">🏠</span><span class="tx">Cadastro</span></a><a href="index.html" target="_top" title="Dashboard"><span class="ic">📊</span><span class="tx">Dashboard</span></a><a href="lista.html" target="_top" title="Lista"><span class="ic">📋</span><span class="tx">Lista</span></a><a class="on" href="consulta.html" target="_top" title="Consulta"><span class="ic">🔎</span><span class="tx">Consulta</span></a><a href="editar.html" target="_top" title="Editar"><span class="ic">✏️</span><span class="tx">Editar</span></a><a href="ficha.html" target="_top" title="Ficha"><span class="ic">📄</span><span class="tx">Ficha</span></a><a href="contrato.html" target="_top" title="Contrato"><span class="ic">📑</span><span class="tx">Contrato</span></a><a href="painel.html" target="_top" title="Painel"><span class="ic">⚙️</span><span class="tx">Painel</span></a></aside><script>(function(){var b=document.body;b.classList.add("comMenu");window.alternarMenu=function(){b.classList.toggle("menuAberto");};document.addEventListener("click",function(e){var s=document.getElementById("side");if(b.classList.contains("menuAberto")&&s&&!s.contains(e.target))b.classList.remove("menuAberto");});document.addEventListener("keydown",function(e){if(e.key==="Escape")b.classList.remove("menuAberto");});})();</script>

<div class="top">
  <div class="lbl">Codigo Flex:</div>
  <div class="cod" id="cod">&nbsp;</div>
  <select id="sel"><option value="">Carregando...</option></select>
  <button onclick="window.print()">Imprimir</button>
</div>
<div class="linha"></div>

<div class="wrap">
  <div class="paper" id="paper"><div class="vazio">Selecione um motorista.</div></div>
</div>

<script>
const KEY = "";
const sel = document.getElementById('sel'), paper = document.getElementById('paper');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

google.script.run.withSuccessHandler(lista => {
  sel.innerHTML = '<option value="">Selecione o motorista</option>' +
    lista.map(m => '<option value="' + esc(m.cod) + '">' + esc(m.nome) + '</option>').join('');
}).withFailureHandler(e => sel.innerHTML = '<option>Erro: ' + esc(e.message) + '</option>').listarMotoristas(KEY);

sel.onchange = () => {
  if (!sel.value) { document.getElementById('cod').innerHTML = '&nbsp;'; paper.innerHTML = '<div class="vazio">Selecione um motorista.</div>'; return; }
  paper.innerHTML = '<div class="vazio">Carregando...</div>';
  google.script.run.withSuccessHandler(render)
    .withFailureHandler(e => paper.innerHTML = '<div class="vazio">Erro: ' + esc(e.message) + '</div>')
    .buscarMotorista(KEY, sel.value);
};

let CFG = { logo: '' };
google.script.run.withSuccessHandler(c => CFG = c).obterConfig(KEY);

function render(m) {
  document.getElementById('cod').textContent = m.cod;
  const slots = 7;
  let itens = m.pendencias.map(t => '<div class="it"><span class="cx"></span>' + esc(t) + '</div>');
  if (!itens.length) itens.push('<div class="it" style="justify-content:center;color:#2e7d32">Nenhuma pendência — documentação em dia.</div>');
  while (itens.length < slots) itens.push('<div class="it"><span class="cx"></span></div>');
  const hoje = new Date().toLocaleDateString('pt-BR');
  paper.innerHTML =
    (CFG.logo ? '<img src="' + CFG.logo + '" style="max-height:52px;max-width:200px">' : '<b style="font-size:22px">' + esc(m.assinatura.empresa) + '</b>') +
    '<div class="nome">' + esc(m.nome) + '</div>' +
    '<div class="dados">' +
      '<div><span><b>CPF:</b></span> ' + esc(m.cpf) + '<br><span><b>Data de Nascimento:</b></span> ' + esc(m.nasc) + '</div>' +
      '<div style="text-align:left"><span><b>Carro:</b></span> ' + esc(String(m.placa).toUpperCase()) + '<br><span><b>Veículo:</b></span> ' + esc(String(m.veiculo).toUpperCase()) + '</div>' +
    '</div>' +
    '<p>Para manter nossos registros em conformidade e garantir que você possa continuar realizando suas atividades normalmente, solicitamos que envie os documentos listados abaixo atualizados:</p>' +
    '<h3>Documentos Vencidos ou Faltando</h3>' + itens.join('') +
    '<p style="margin-top:26px">Pedimos que encaminhe as atualizações para que possamos manter seu cadastro completo e atualizado.</p>' +
    '<p>Agradecemos sua atenção e colaboração.</p>' +
    '<div class="ass">Atenciosamente,<br>' + esc(m.assinatura.nome) + '<br>' + esc(m.assinatura.cargo) + '</div>' +
    '<div class="rod">' + (CFG.logo ? '<img src="' + CFG.logo + '" style="max-height:44px;max-width:180px"><br>' : '') + esc(m.assinatura.empresa) + '</div>' +
    '<div class="data">' + hoje + '</div>';
}
</script>
</body>
</html>
