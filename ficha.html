<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Ficha</title>
<script src="config.js"></script>
<script src="app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:12px;color:#222}
  .nav{max-width:820px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap}
  .nav a{padding:8px 16px;border-radius:8px;background:#fff;color:#1f7a3f;text-decoration:none;font-weight:bold;box-shadow:0 1px 3px #0002}
  .nav a.on{background:#1f7a3f;color:#fff}
  .box{max-width:820px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 6px #0002}
  h2.t{margin-top:0;color:#1f7a3f}
  .busca{display:grid;grid-template-columns:1fr 2fr;gap:10px}
  label{font-size:13px;display:block}
  input,select{width:100%;box-sizing:border-box;padding:8px;margin-top:3px;border:1px solid #bbb;border-radius:6px;font-size:15px}
  .acoes{display:none;gap:10px;margin:14px 0;flex-wrap:wrap}
  .acoes button{flex:1;min-width:200px;background:#1f7a3f;color:#fff;border:0;padding:12px;border-radius:8px;font-size:15px;cursor:pointer}
  .acoes button.b2{background:#0b4f7a}
  button:disabled{opacity:.6}
  #msg{font-weight:bold;margin:8px 0}
  #prev{border:1px solid #ddd;padding:14px;border-radius:6px;background:#fff;overflow-x:auto}
  @page{size:A4;margin:10mm}
  @media print{
    #prev{overflow:visible!important}
    #prev .ficha{width:100%!important;max-width:100%!important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{background:#fff;padding:0}
    .nav,.ctl,.acoes,#msg,h2.t{display:none!important}
    .box{box-shadow:none;padding:0;max-width:none}
    #prev{border:0;padding:0}
  }
  /* abas fixas: só o conteúdo abaixo delas rola */
  .nav{position:sticky;top:0;z-index:10;background:#f3f4f6;margin-top:-12px!important;padding:12px 0 8px}
  /* menu lateral: faixa de ícones; ao abrir (☰) ele cobre a tela e recolhe sozinho ao clicar fora */
  body.comMenu{padding-left:68px!important}
  .side{position:fixed;left:0;top:0;bottom:0;width:56px;background:#1f7a3f;z-index:40;display:flex;flex-direction:column;gap:2px;padding:8px 6px;box-sizing:border-box;overflow:hidden;transition:width .15s,box-shadow .15s}
  body.menuAberto .side{width:190px;box-shadow:4px 0 18px #0005}
  .side a{color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;white-space:nowrap;font-weight:bold;font-size:14px}
  .side a:hover{background:#2f9b57}.side a.on{background:#fff;color:#1f7a3f}
  .side .ic{width:22px;text-align:center;flex:none}
  .sideBtn{background:none!important;border:0;color:#fff;font-size:20px;text-align:left;padding:8px 12px!important;cursor:pointer;width:auto!important;min-width:0!important;flex:none!important;margin-bottom:6px}
  body:not(.menuAberto) .side .tx{display:none}
  @media print{body.comMenu{padding-left:0!important}.side{display:none!important}}
</style>
</head>
<body>
<aside class="side" id="side"><button type="button" class="sideBtn" onclick="alternarMenu()" title="Minimizar ou expandir o menu">☰</button><a href="novo.html" target="_top" title="Cadastro"><span class="ic">🏠</span><span class="tx">Cadastro</span></a><a href="index.html" target="_top" title="Dashboard"><span class="ic">📊</span><span class="tx">Dashboard</span></a><a href="lista.html" target="_top" title="Lista"><span class="ic">📋</span><span class="tx">Lista</span></a><a href="consulta.html" target="_top" title="Consulta"><span class="ic">🔎</span><span class="tx">Consulta</span></a><a href="editar.html" target="_top" title="Editar"><span class="ic">✏️</span><span class="tx">Editar</span></a><a class="on" href="ficha.html" target="_top" title="Ficha"><span class="ic">📄</span><span class="tx">Ficha</span></a><a href="contrato.html" target="_top" title="Contrato"><span class="ic">📑</span><span class="tx">Contrato</span></a><a href="painel.html" target="_top" title="Painel"><span class="ic">⚙️</span><span class="tx">Painel</span></a></aside><script>(function(){var b=document.body;b.classList.add("comMenu");window.alternarMenu=function(){b.classList.toggle("menuAberto");};document.addEventListener("click",function(e){var s=document.getElementById("side");if(b.classList.contains("menuAberto")&&s&&!s.contains(e.target))b.classList.remove("menuAberto");});document.addEventListener("keydown",function(e){if(e.key==="Escape")b.classList.remove("menuAberto");});})();</script>
<div class="box">
  <h2 class="t">Ficha de cadastro</h2>
  <div class="busca ctl">
    <label>Filtrar<input id="filtro" placeholder="nome ou código"></label>
    <label>Proprietário<select id="sel"><option>Carregando...</option></select></label>
  </div>
  <div class="acoes" id="acoes">
    <button onclick="window.print()">Imprimir / Salvar como PDF</button>
    <button class="b2" id="bpdf" onclick="gerarPdf()">Gerar PDF e guardar no Drive</button>
  </div>
  <div id="msg"></div>
  <div id="prev"></div>
</div>

<script>
const KEY = "";
const sel = document.getElementById('sel'), msg = document.getElementById('msg'), filtro = document.getElementById('filtro');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lista = [];

function mostrarLista() {
  const q = filtro.value.trim().toLowerCase(), atual = sel.value;
  const itens = lista.filter(m => !q || ((m.codReal || 'sem codigo') + ' ' + m.nome).toLowerCase().includes(q));
  sel.innerHTML = '<option value="">Selecione</option>' + itens.map(m =>
    '<option value="' + esc(m.cod) + '">' + (m.codReal ? esc(m.codReal) : 'sem código') + ' - ' + esc(m.nome) + (/inativo/i.test(m.status) ? ' (inativo)' : '') + '</option>').join('');
  sel.value = atual;
}
google.script.run.withSuccessHandler(l => { lista = l; mostrarLista(); })
  .withFailureHandler(e => sel.innerHTML = '<option>Erro: ' + esc(e.message) + '</option>').listarMotoristas(KEY, true);
filtro.oninput = mostrarLista;

sel.onchange = () => {
  msg.textContent = '';
  document.getElementById('prev').innerHTML = '';
  document.getElementById('acoes').style.display = 'none';
  if (!sel.value) return;
  msg.style.color = '#333'; msg.textContent = 'Carregando...';
  google.script.run.withSuccessHandler(html => {
    document.getElementById('prev').innerHTML = html;
    document.getElementById('acoes').style.display = 'flex';
    msg.textContent = '';
  }).withFailureHandler(e => { msg.style.color = 'red'; msg.textContent = 'Erro: ' + e.message; }).gerarFicha(KEY, sel.value);
};

function gerarPdf() {
  const b = document.getElementById('bpdf');
  b.disabled = true; msg.style.color = '#333'; msg.textContent = 'Gerando PDF...';
  google.script.run.withSuccessHandler(r => {
    b.disabled = false; msg.style.color = 'green';
    msg.innerHTML = 'PDF salvo na pasta do motorista. <a href="' + esc(r.url) + '" target="_blank">Abrir PDF</a>';
  }).withFailureHandler(e => { b.disabled = false; msg.style.color = 'red'; msg.textContent = 'Erro: ' + e.message; }).salvarFichaPdf(KEY, sel.value);
}
</script>
</body>
</html>
