<script>
const KEY = "";
const MAX = 10 * 1024 * 1024;
let TIPOS_VEICULO_LISTA = ['FIORINO', 'KOMBI', 'VAN', 'CAMINHÃO 3/4', 'CARRETA'];
function aplicarTipos(l) {

    if (v && !l.includes(v)) s.add(new Option(v, v));      // valor antigo fora da lista: não perder

}
const T = {t:'text'};
// [coluna, rótulo, tipo]
const GRUPOS = [
  ['Cadastro', [['COD/FLEX','Código Flex'],['Status','Status','status'],['Motorista','Nome completo'],['Data de Nascimento','Data de nascimento','date'],['CPF','CPF'],['Celular','Celular','tel'],['E-mail','E-mail','email'],['Tipo Chave Pix','Tipo da chave Pix','pix'],['Chave Pix','Chave Pix']]],
  ['Endereço', [['CEP','CEP'],['Logradouro','Logradouro (rua/avenida)'],['Número Endereço','Número'],['Complemento','Complemento'],['Bairro','Bairro'],['Cidade','Cidade'],['UF','UF','uf']]],
  ['Veículo', [['Placa Veículo','Placa'],['Tipo de Veículo','Tipo de veículo','tipo'],['Marca/Modelo','Marca/Modelo'],['Renavam','Renavam'],['Chassi','Chassi'],['Ano Fabricação','Ano de fabricação','number'],['Cor','Cor'],['CARGA MÁXIMA (KG)','Carga máxima (kg)','number']]],
  ['Proprietário do veículo', [['Proprietário','Nome do proprietário (vazio = o próprio motorista)'],['CPF Proprietário','CPF ou CNPJ do proprietário'],['E-mail Proprietário','E-mail','email'],['Celular Proprietário','Celular','tel'],['Tipo Chave Pix Proprietário','Tipo da chave Pix','pix'],['Chave Pix Proprietário','Chave Pix'],['CEP Proprietário','CEP'],['Logradouro Proprietário','Logradouro (rua/avenida)'],['Número Proprietário','Número'],['Complemento Proprietário','Complemento'],['Bairro Proprietário','Bairro'],['Cidade Proprietário','Cidade'],['UF Proprietário','UF','uf']]]
];
// documentos: título, campos, tipo do PDF, coluna do link
const DOCS = [
  ['CNH do motorista', [['Número CNH','Número da CNH'],['CNH-DATA EMISSÃO','Data de emissão','date'],['CNH-DATA DE VALIDADE','Data de validade','date']], 'CNH', 'Link CNH'],
  ['CNH do proprietário', [['Número CNH Proprietário','Número da CNH'],['CNH Validade Proprietário','Validade','date']], 'CNH PROPRIETARIO', 'Link CNH Proprietário'],
  ['CRLV', [['Número CRLV','Número do CRLV'],['UF Veículo','UF de licenciamento do veículo','uf'],['CRLV Exercício','Ano (exercício) do último CRLV emitido','number'],['CRLV Débito Pendente','Há débito pendente (IPVA, taxas ou multas)','check']], 'CRLV', 'Link CRLV'],
  ['ANTT', [['Número ANTT','Número da ANTT'],['Situação ANTT','Situação na ANTT (vale se estiver ativa)','antt'],['Consulta ANTT em','Consultada em','date']], 'ANTT', 'Link ANTT'],
  ['Vigilância Sanitária', [['CVV: VIGILANCIA','Data (vencimento)','date']], 'VIGILANCIA', 'Link Vigilancia'],
  ['Nada Costa', [['NADA COSTA','Entregue','check'],['Data Nada Costa','Data de emissão','date']], 'NADA COSTA', 'Link Nada Costa'],
  ['Comprovante de residência', [['RESIDENCIA','Entregue','check'],['Data Residência','Data de emissão','date']], 'RESIDENCIA', 'Link Residencia'],
  ['Contrato PAMC', [['CONTRATO PAMC','Aceito','check']], 'CONTRATO PAMC', 'Link Contrato PAMC']
];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function campo([nome, rot, tipo]) {
  if (tipo === 'check') return '<div class="chk"><input type="checkbox" id="k_' + esc(nome) + '" name="' + esc(nome) + '"><label for="k_' + esc(nome) + '" style="display:inline">' + rot + '</label></div>';
  if (tipo === 'status') return '<label>' + rot + '<select name="' + nome + '"><option>Ativo</option><option>Inativo</option></select></label>';
  if (tipo === 'tipo') return '<label>' + rot + '<select name="' + nome + '"><option value="">Selecione</option>' + TIPOS_VEICULO_LISTA.map(o => '<option>' + o + '</option>').join('') + '</select></label>';
  if (tipo === 'antt') return '<label>' + rot + '<select name="' + nome + '"><option value="">Não consultada</option><option>Ativa</option><option>Inativa</option><option>Suspensa</option><option>Cancelada</option></select></label>';
  if (tipo === 'pix') return '<label>' + rot + '<select name="' + nome + '"><option value="">Selecione</option>' + ['CPF','CNPJ','E-mail','Celular','Chave aleatória'].map(o => '<option>' + o + '</option>').join('') + '</select></label>';
  if (tipo === 'uf') return '<label>' + rot + '<select name="' + nome + '"><option value="">Selecione</option>' + ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO'].map(o => '<option>' + o + '</option>').join('') + '</select></label>';
  return '<label>' + rot + '<input name="' + esc(nome) + '" type="' + (tipo || 'text') + '"></label>';
}
document.getElementById('campos').innerHTML =
  GRUPOS.map(g => '<fieldset><legend>' + g[0] + '</legend><div class="grid">' + g[1].map(campo).join('') + '</div></fieldset>').join('') +
  '<fieldset><legend>Documentos <small>(anexar um arquivo novo substitui o atual; fotos viram PDF sozinhas)</small></legend><div class="grid">' +
  DOCS.map(d => '<div class="doc"><b>' + d[0] + '</b>' + d[1].map(campo).join('') + (d[2] === 'CRLV' ? '<small>O prazo de renovação vem da aba "Calendário CRLV" (UF + final da placa + ano).</small>' : '') + (d[2] === 'ANTT' ? '<div><a href="https://consultapublica.antt.gov.br/Site/ConsultaRNTRC.aspx/ConsultaPublica/" rel="noopener">Consultar na ANTT ↗</a></div>' : '') +
    (d[2] ? '<label>' + (d[2] === 'CONTRATO PAMC' ? 'PDF ou Word' : 'PDF ou foto') + '<input type="file" ' + (d[2] === 'CONTRATO PAMC' ? 'accept=".pdf,.doc,.docx" data-aceita="pdf,doc,docx"' : 'accept="application/pdf,image/*"') + ' data-tipo="' + d[2] + '"' +
      (d[1][0][2] === 'check' ? ' data-check="k_' + d[1][0][0] + '"' : '') + '></label><div data-link="' + d[3] + '"></div>' : '') +
    '</div>').join('') + '</div></fieldset>';

document.querySelectorAll('input[type=file][data-check]').forEach(i =>
  i.addEventListener('change', () => { if (i.files[0]) document.getElementById(i.dataset.check).checked = true; }));

const sel = document.getElementById('sel'), msg = document.getElementById('msg'), filtro = document.getElementById('filtro');
let lista = [], codOriginal = null;

function mostrarLista(manter) {
  const q = filtro.value.trim().toLowerCase();
  const itens = lista.filter(m => !q || ((m.codReal || 'sem codigo') + ' ' + m.nome).toLowerCase().includes(q));
  sel.innerHTML = '<option value="">Selecione o motorista</option>' + itens.map(m =>
    '<option value="' + esc(m.cod) + '">' + (m.codReal ? esc(m.codReal) : 'sem código') + ' - ' + esc(m.nome) + (/inativo/i.test(m.status) ? ' (inativo)' : '') + '</option>').join('');
  if (manter) sel.value = manter;
}
function carregarLista(manter, depois) {
  google.script.run.withSuccessHandler(l => { lista = l; mostrarLista(manter); if (depois) depois(); })
    .withFailureHandler(e => sel.innerHTML = '<option>Erro: ' + esc(e.message) + '</option>').listarMotoristas(KEY, true);
}
carregarLista();
filtro.oninput = () => mostrarLista(sel.value);

sel.onchange = () => carregar(sel.value);
function carregar(cod) {
  msg.textContent = '';
  if (!cod) { document.getElementById('form').style.display = 'none'; return; }
  msg.style.color = '#333'; msg.textContent = 'Carregando...';
  google.script.run.withSuccessHandler(v => {
    codOriginal = cod;
    document.querySelectorAll('#form [name]').forEach(el => {
      const val = v[el.name];
      if (el.type === 'checkbox') el.checked = val === true;
      else {
        if (el.tagName === 'SELECT' && val && ![...el.options].some(o => o.value === val)) el.add(new Option(val, val));   // valor antigo fora da lista: não perder
        el.value = val == null ? '' : val;
      }
    });
    document.querySelectorAll('input[type=file]').forEach(i => i.value = '');
    document.querySelectorAll('[data-link]').forEach(d => {
      const u = v[d.dataset.link];
      d.innerHTML = u ? '<a href="' + esc(u) + '" target="_blank">Ver arquivo atual</a>' : '<small>Nenhum PDF anexado</small>';
    });
    document.getElementById('form').style.display = 'block';
    msg.textContent = '';
  }).withFailureHandler(e => { msg.style.color = 'red'; msg.textContent = 'Erro: ' + e.message; }).obterMotorista(KEY, cod);
}

// ---- foto -> PDF (sem bibliotecas): redimensiona, vira JPEG e é embutida numa página A4 ----
function jpegParaPdf(jpeg, w, h) {
  const enc = new TextEncoder();
  const paisagem = w > h, pw = paisagem ? 842 : 595, ph = paisagem ? 595 : 842, m = 28;
  const s = Math.min((pw - 2 * m) / w, (ph - 2 * m) / h);
  const iw = w * s, ih = h * s, x = (pw - iw) / 2, y = (ph - ih) / 2;
  const partes = [], offs = []; let tam = 0;
  const add = d => { const b = typeof d === 'string' ? enc.encode(d) : d; partes.push(b); tam += b.length; };
  const obj = (n, corpo) => { offs[n] = tam; add(n + ' 0 obj\n' + corpo + '\nendobj\n'); };
  add('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4] = tam;
  add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n');
  add(jpeg); add('\nendstream\nendobj\n');
  const cont = 'q ' + iw.toFixed(2) + ' 0 0 ' + ih.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /Im0 Do Q';
  obj(5, '<< /Length ' + cont.length + ' >>\nstream\n' + cont + '\nendstream');
  const xref = tam;
  let t = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) t += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(t + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  const out = new Uint8Array(tam); let p = 0;
  partes.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}
function bytesParaBase64(b) {
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
async function imagemParaPdf(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, erro) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => erro('Não consegui abrir a imagem "' + file.name + '". Envie em JPG, PNG ou PDF.');
      i.src = url;
    });
    let w = img.naturalWidth, h = img.naturalHeight;
    const k = Math.min(1, 2000 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
    const bin = atob(cv.toDataURL('image/jpeg', 0.85).split(',')[1]);
    const jpeg = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) jpeg[i] = bin.charCodeAt(i);
    return bytesParaBase64(jpegParaPdf(jpeg, w, h));
  } finally { URL.revokeObjectURL(url); }
}

// Lê o anexo: PDF segue como está; foto vira PDF; o Contrato PAMC (data-aceita) segue como está (PDF/Word)
async function lerPdf(input) {
  const f = input.files[0];
  if (!f) return null;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const aceita = input.dataset.aceita;
  const ehImagem = (f.type || '').startsWith('image/') || /^(jpe?g|png|gif|webp|bmp|avif|heic|heif)$/.test(ext);
  if (!aceita && ehImagem) {
    if (f.size > 25 * 1024 * 1024) throw '"' + f.name + '" passa de 25 MB.';
    return { tipo: input.dataset.tipo, ext: 'pdf', base64: await imagemParaPdf(f) };
  }
  const permitidos = (aceita || 'pdf').split(',');
  if (!permitidos.includes(ext)) throw '"' + f.name + '" precisa ser ' + (aceita ? permitidos.join(' / ').toUpperCase() : 'PDF ou foto') + '.';
  if (f.size > MAX) throw '"' + f.name + '" passa de 10 MB.';
  return new Promise((ok, erro) => {
    const r = new FileReader();
    r.onload = () => ok({ tipo: input.dataset.tipo, ext: ext, base64: r.result.split(',')[1] });
    r.onerror = () => erro('Falha ao ler ' + f.name);
    r.readAsDataURL(f);
  });
}

// CEP: máscara 00000-000 e preenchimento automático (ViaCEP) de rua, bairro, cidade e UF
function ligarCep(inputCep, obter) {
  if (!inputCep) return;
  inputCep.addEventListener('input', () => {
    const d = inputCep.value.replace(/\D/g, '').slice(0, 8);
    inputCep.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
  });
  inputCep.addEventListener('change', async () => {
    const d = inputCep.value.replace(/\D/g, '');
    if (d.length !== 8) return;
    try {
      const j = await (await fetch('https://viacep.com.br/ws/' + d + '/json/')).json();
      if (j.erro) return;
      [['Logradouro', j.logradouro], ['Bairro', j.bairro], ['Cidade', j.localidade], ['UF', j.uf]].forEach(([n, v]) => {
        const el = obter(n); if (el && v) el.value = v;
      });
    } catch (e) { /* sem internet ou CEP fora do ar: o usuário digita à mão */ }
  });
}

async function salvar() {
  const btn = document.getElementById('btn');
  const dados = {};
  document.querySelectorAll('#form [name]').forEach(el => dados[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim());
  if (!dados['Motorista']) { msg.style.color = 'red'; msg.textContent = 'Informe o nome do motorista.'; return; }
  if (dados['Placa Veículo']) dados['Placa Veículo'] = dados['Placa Veículo'].toUpperCase();

  btn.disabled = true; msg.style.color = '#333'; msg.textContent = 'Salvando...';
  try {
    const arquivos = (await Promise.all([...document.querySelectorAll('input[type=file]')].map(lerPdf))).filter(Boolean);
    google.script.run
      .withSuccessHandler(r => {
        msg.style.color = 'green'; msg.textContent = 'Alterações salvas!';
        btn.disabled = false;
        carregarLista(String(r.id), () => carregar(String(r.id)));
      })
      .withFailureHandler(e => { msg.style.color = 'red'; msg.textContent = 'Erro: ' + e.message; btn.disabled = false; })
      .atualizarCadastro(KEY, codOriginal, dados, arquivos);
  } catch (e) {
    msg.style.color = 'red'; msg.textContent = e; btn.disabled = false;
  }
}
ligarCep(document.querySelector('#form [name="CEP"]'), n => document.querySelector('#form [name="' + n + '"]'));

// Pix: ao escolher o tipo, preenche a chave com o CPF / e-mail / celular já digitados (se a chave estiver vazia)
function ligarPix(raiz, suf) {
  suf = suf || '';
  const q = n => raiz.querySelector('[name="' + n + suf + '"]');
  const tipo = q('Tipo Chave Pix'), chave = q('Chave Pix');
  if (!tipo || !chave) return;
  tipo.addEventListener('change', () => {
    if (chave.value.trim()) return;
    const origem = { 'CPF': 'CPF', 'E-mail': 'E-mail', 'Celular': 'Celular' }[tipo.value];
    if (origem && q(origem)) chave.value = q(origem).value;
  });
}
ligarPix(document.getElementById('form'));
ligarPix(document.getElementById('form'), ' Proprietário');
google.script.run.withSuccessHandler(aplicarTipos).tiposVeiculo();

// ---- máscaras: CPF/CNPJ e telefone (campos de texto: os zeros da frente e do fim ficam) ----
const soNum = s => String(s || '').replace(/\D/g, '');
function mCpfCnpj(v) {
  const d = soNum(v).slice(0, 14);
  if (d.length <= 11) { let o = d.slice(0, 3); if (d.length > 3) o += '.' + d.slice(3, 6); if (d.length > 6) o += '.' + d.slice(6, 9); if (d.length > 9) o += '-' + d.slice(9, 11); return o; }
  let o = d.slice(0, 2) + '.' + d.slice(2, 5) + '.' + d.slice(5, 8) + '/' + d.slice(8, 12); if (d.length > 12) o += '-' + d.slice(12, 14); return o;
}
function mTel(v) {
  const d = soNum(v).slice(0, 11); if (!d) return '';
  let o = '(' + d.slice(0, 2);
  if (d.length > 2) { const corte = d.length > 10 ? 7 : 6; o += ') ' + d.slice(2, corte); if (d.length > corte) o += '-' + d.slice(corte); }
  return o;
}
function ligarMascaras(raiz) {
  const liga = (sel, fn, ph) => raiz.querySelectorAll(sel).forEach(el => { el.setAttribute('inputmode', 'numeric'); el.removeAttribute('maxlength'); if (ph) el.placeholder = ph; el.addEventListener('input', () => { el.value = fn(el.value); }); });
  liga('[name="CPF"],[name="CPF Proprietário"]', mCpfCnpj, '000.000.000-00');
  liga('[name="Celular"],[name="Celular Proprietário"]', mTel, '(00) 00000-0000');
}
ligarMascaras(document.getElementById('form'));
ligarCep(document.querySelector('#form [name="CEP Proprietário"]'), n => document.querySelector('#form [name="' + n + ' Proprietário"]'));
</script>
